<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAREKET | Puantaj</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#19332d;font:14px system-ui}header{background:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #dce5e0}header img{width:190px}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button,select,input{font:inherit;padding:11px;border:1px solid #ccd9d3;border-radius:8px;background:white;color:inherit}button{cursor:pointer;font-weight:600}button.primary,button.active{background:#006247;color:white;border-color:#006247}button:hover{filter:brightness(.95)}.panel{background:white;border:1px solid #dce5e0;border-radius:14px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.day{min-height:64px;text-align:left}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day.selected{outline:2px solid #006247;background:#e4f3ec}.day small{display:block;font-size:10px}label{display:flex;flex-direction:column;gap:6px;font-weight:600}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin-top:0}p{color:#64776e}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #e6ece9}th{font-size:12px;color:#64776e}.stat{font-size:27px;font-weight:700}.tag{background:#edf4ef;border-radius:6px;padding:5px 8px}footer{padding:16px;text-align:center;color:#64776e}@media(max-width:600px){main{padding:12px}.panel{padding:14px}.day{padding:6px;min-height:55px}.calendar{gap:3px}}
</style><header><img src="logo.png" alt="HAREKET"><div><strong>PERSONEL PUANTAJ YÖNETİMİ</strong><br><small>DEMO • Yalnızca örnek veri</small></div><label>Demo kullanıcı<select id="user"></select></label></header><main><nav id="nav"></nav><div id="view"></div></main><footer>HAREKET • Puantaj Yönetimi / Pilot v1.0</footer><script>
const names=['Demo Personel 01|Vinç|Sapancı_Vinç|Sapancı','Demo Personel 02|Vinç|Sapancı_Vinç|Sapancı','Demo Personel 03|Tavan Vinci|Mekanik Teknisyen/Tekniker|Bakımcı','Demo Personel 04|Vinç|Vinç&Kazı&Nakliye Yöneticisi|Yönetici','Demo Personel 05|Vinç|Sapancı_Vinç|Sapancı','Demo Personel 06|Tavan Vinci|Elektrik Teknisyen/Tekniker|Bakımcı','Demo Personel 07|Vinç|Sapancı_Vinç|Sapancı','Demo Personel 08|Vinç|Vinç Formeni|Yeşil Yaka','Demo Personel 09|Vinç|Çekici Şoförü|Operatör','Demo Personel 10|Vinç|Sapancı_Vinç|Sapancı','Demo Personel 11|Vinç|Vinç&Kazı&Nakliye Proje Destek Uzmanı|Uzman','Demo Personel 12|Vinç|Sapancı_Vinç|Sapancı','Demo Personel 13|Nakliye&Kazı|Traktör Şoförü|Operatör'].map((s,i)=>({id:i,...Object.fromEntries(s.split('|').map((v,j)=>[['name','scope','job','cat'][j],v])),manager:i===3?7:3}));
let people=JSON.parse(localStorage.getItem('hp_demo_people')||'null')||names, records=JSON.parse(localStorage.getItem('hp_demo_records')||'[]'), uid=0, tab=0, selected=new Set(), now=new Date(), month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), person=id=>people.find(p=>p.id==id), save=()=>{localStorage.setItem('hp_demo_people',JSON.stringify(people));localStorage.setItem('hp_demo_records',JSON.stringify(records))}, mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m}, hours=r=>((mins(r.end)-mins(r.start)+1440)%1440-r.break)/60, fmt=n=>n.toLocaleString('tr-TR',{maximumFractionDigits:2}), opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
$('user').innerHTML=people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('user').onchange=()=>{uid=+$('user').value;selected.clear();render()};
function render(){ $('nav').innerHTML=['Puantajım','Onay merkezi','Raporlar','Personel tanımları'].map((n,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${n}</button>`).join('');[entry,approval,reports,settings][tab]() }
function entry(){let [y,m]=month.split('-').map(Number), days=new Date(y,m,0).getDate(), offset=(new Date(y,m-1,1).getDay()+6)%7; $('view').innerHTML=`<h1>Puantajım</h1><p>${esc(person(uid).name)} · Onay yöneticisi: ${esc(person(person(uid).manager)?.name)}</p><div class="panel"><div class="grid"><label>Çalışma ayı<input type="month" value="${month}" onchange="month=this.value;selected.clear();entry()"></label><div><p>Seçili gün: <b>${selected.size}</b></p><button onclick="selected.clear();entry()">Seçimi temizle</button></div></div><br><div class="calendar">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<small>${d}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'),r=records.find(r=>r.uid===uid&&r.date===d);return `<button class="day ${selected.has(d)?'selected':''}" onclick="toggle('${d}')">${i+1}<small>${r?esc(r.status):''}</small></button>`}).join('')}</div></div><div class="panel"><h2>Çalışma bilgileri</h2><div class="grid"><label>Giriş<input id="start" type="time" value="08:00"></label><label>Çıkış<input id="end" type="time" value="17:00"></label><label>Mola (dk)<input id="break" type="number" min="0" value="60"></label><label>Lokasyon<select id="loc" onchange="$('codeLabel').textContent=this.value==='Türkiye'?'Proje kodu':'Makine kodu'">${opts(['Türkiye','Dubai'],'Türkiye')}</select></label><label><span id="codeLabel">Proje kodu</span><input id="code" placeholder="Kod giriniz"></label></div><p>Seçili günlere aynı çalışma bilgileri uygulanır. Gece vardiyası desteklenir.</p><button class="primary" onclick="submitEntry()">Yönetici onayına gönder</button></div><div class="panel"><h2>Kayıtlarım</h2>${table(records.filter(r=>r.uid===uid&&r.date.startsWith(month)))}</div>`}
function toggle(d){let fields=['start','end','break','loc','code'].map(k=>$(k).value);selected.has(d)?selected.delete(d):selected.add(d);entry();['start','end','break','loc','code'].forEach((k,i)=>$(k).value=fields[i]);$('loc').onchange()}
function submitEntry(){let r={uid,start:$('start').value,end:$('end').value,break:+$('break').value,loc:$('loc').value,code:$('code').value.trim(),manager:person(uid).manager,status:'Bekliyor'};if(!selected.size||!r.code||!r.start||!r.end||r.break<0||hours(r)<=0)return alert('Gün, geçerli saat, mola ve kod giriniz.');if([...selected].some(d=>records.some(x=>x.uid===uid&&x.date===d&&x.status!=='İade')))return alert('Seçimde mevcut kayıt var. Yalnızca iade edilen kayıt yeniden gönderilebilir.');for(let date of selected){records=records.filter(x=>!(x.uid===uid&&x.date===date));records.push({...r,date,id:Date.now()+'-'+date})}save();selected.clear();entry()}
function table(rs,actions=false){return `<div class="scroll"><table><thead><tr>${['Personel','Tarih','Giriş','Çıkış','Mola','Lokasyon','Kod','Net saat','Durum',...(actions?['İşlem']:[])].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${[person(r.uid).name,r.date,r.start,r.end,r.break,r.loc,r.code,fmt(hours(r)),r.status].map(x=>`<td>${esc(x)}</td>`).join('')}${actions?`<td><button onclick="edit('${r.id}')">İncele / düzenle</button></td>`:''}</tr>`).join('')||'<tr><td colspan="10">Kayıt bulunmuyor.</td></tr>'}</tbody></table></div>`}
function approval(){let rs=records.filter(r=>r.manager===uid);$('view').innerHTML=`<h1>Onay merkezi</h1><p>${esc(person(uid).name)} · Size atanmış kayıtlar</p><div class="panel"><h2>Bekleyen: ${rs.filter(r=>r.status==='Bekliyor').length}</h2>${table(rs.filter(r=>r.status==='Bekliyor'),true)}</div><div class="panel"><h2>İşlem geçmişi</h2>${table(rs.filter(r=>r.status!=='Bekliyor'))}</div><div id="editor"></div>`}
function edit(id){let r=records.find(x=>x.id===id&&x.manager===uid&&x.status==='Bekliyor');if(!r)return;$('editor').innerHTML=`<div class="panel"><h2>${esc(person(r.uid).name)} · ${r.date}</h2><div class="grid"><label>Giriş<input id="es" type="time" value="${r.start}"></label><label>Çıkış<input id="ee" type="time" value="${r.end}"></label><label>Mola<input id="eb" type="number" min="0" value="${r.break}"></label><label>Lokasyon<select id="el">${opts(['Türkiye','Dubai'],r.loc)}</select></label><label>Proje / makine kodu<input id="ec" value="${esc(r.code)}"></label><label>Açıklama<input id="note"></label></div><br><button class="primary" onclick="decide('${id}','Onaylandı')">Kaydet ve onayla</button> <button onclick="decide('${id}','İade')">İade et</button></div>`;$('editor').scrollIntoView({behavior:'smooth'})}
function decide(id,status){let r=records.find(x=>x.id===id&&x.manager===uid&&x.status==='Bekliyor');if(!r)return;let next={...r,start:$('es').value,end:$('ee').value,break:+$('eb').value,loc:$('el').value,code:$('ec').value.trim(),note:$('note').value,status};if(status==='İade'&&!next.note.trim())return alert('İade gerekçesi giriniz.');if(status==='Onaylandı'&&(!next.code||!next.start||!next.end||next.break<0||hours(next)<=0))return alert('Geçerli çalışma bilgileri giriniz.');Object.assign(r,status==='İade'?{status,note:next.note}:{...next,original:{start:r.start,end:r.end,break:r.break,loc:r.loc,code:r.code}});save();approval()}
let period='Aylık', reportDate=now.toISOString().slice(0,10), reportLoc='Tümü';function filtered(){let d=new Date(reportDate+'T12:00:00'),a=new Date(d),b=new Date(d);a.setDate(d.getDate()-(d.getDay()+6)%7);b=new Date(a);b.setDate(a.getDate()+7);return records.filter(r=>{let t=new Date(r.date+'T12:00:00');return (reportLoc==='Tümü'||r.loc===reportLoc)&&(period==='Günlük'?r.date===reportDate:period==='Aylık'?r.date.slice(0,7)===reportDate.slice(0,7):t>=a&&t<b)})}
function reports(){let rs=filtered(),ok=rs.filter(r=>r.status==='Onaylandı');$('view').innerHTML=`<h1>Raporlama merkezi</h1><div class="panel grid"><label>Periyot<select onchange="period=this.value;reports()">${opts(['Günlük','Haftalık','Aylık'],period)}</select></label><label>Referans tarih<input type="date" value="${reportDate}" onchange="reportDate=this.value;reports()"></label><label>Lokasyon<select onchange="reportLoc=this.value;reports()">${opts(['Tümü','Türkiye','Dubai'],reportLoc)}</select></label></div><div class="grid">${[['Onaylı net saat',fmt(ok.reduce((s,r)=>s+hours(r),0))],['Onaylı personel-gün',ok.length],['Bekleyen',rs.filter(r=>r.status==='Bekliyor').length],['İade',rs.filter(r=>r.status==='İade').length]].map(([k,v])=>`<div class="panel">${k}<div class="stat">${v}</div></div>`).join('')}</div><div class="panel"><button onclick="csv()">CSV / Excel için dışa aktar</button>${table(rs)}</div>`}
function csv(){let rows=[['Personel','Tarih','Giriş','Çıkış','Mola','Lokasyon','Kod','Net saat','Durum'],...filtered().map(r=>[person(r.uid).name,r.date,r.start,r.end,r.break,r.loc,r.code,fmt(hours(r)),r.status])];let data=rows.map(row=>row.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='puantaj.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){$('view').innerHTML=`<h1>Personel ve yönetici tanımları</h1><p>Demo yönetici atamaları. Yeni gönderimlerde geçerlidir.</p><div class="panel scroll"><table><tr><th>Ad Soyad</th><th>Kapsam</th><th>Görev</th><th>Kategori</th><th>Onay yöneticisi</th></tr>${people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.scope)}</td><td>${esc(p.job)}</td><td>${esc(p.cat)}</td><td><select onchange="person(${p.id}).manager=+this.value;save()">${people.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}" ${x.id===p.manager?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}render();</script></html>
